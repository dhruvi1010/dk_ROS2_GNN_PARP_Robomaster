controller_server:
  ros__parameters:
    odom_topic: "odom"
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.60
      yaw_goal_tolerance: 0.5
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.6 #3.5
      max_vel_y: 0.1
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.25
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.75
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      
      # Goal Tolerance
      yaw_goal_tolerance: 0.50
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.10
      theta_stopped_velocity: 0.10

      # Forward Simulation
      sim_time: 0.8
      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 50
      sim_granularity: 0.015
      angular_sim_granularity: 0.015
      
      # Trajectory Scoring
      path_distance_bias: 20.0
      goal_distance_bias: 24.0
      occdist_scale: 0.25
      twirling_scale: 0.0
      stop_time_buffer: 0.3
      oscillation_reset_dist: 0.05
      oscillation_reset_angle: 0.2
      prune_plan: true
      prune_distance: 0.5

      # Debugging
      publish_cost_grid_pc: false
      publish_evaluation: true
      publish_global_plan: true
      publish_local_plan: true
      publish_trajectories: true
      publish_transformed_plan: true

      # Critic scoring parameters
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 20.0
      PathAlign.scale: 24.0
      GoalAlign.scale: 18.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 28.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 10.0
      RotateToGoal.lookahead_time: 1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: <robot_namespace>odom
      robot_base_frame: <robot_namespace>base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05      
      # robot_radius: 0.22
      footprint: "[[-0.160, -0.120], [-0.160, 0.120], [0.160, 0.120], [0.160, -0.120]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "gnn_costmap_layer", "inflation_layer"]
      gnn_costmap_layer:
        plugin: "gnn_objects_layer::GNNObjectsLayer"
        enabled: True
        topic: "/tracked_polygons"
        label_decay_times: [5.0, 20.0, 5.0, 10.0, 20.0] #Other WS Robot Boundary Forklift
        # label_decay_times: [0.0, 15.0, 3.0, 30.0, 5.0] #Other WS Robot Boundary Forklift
        label_inflation_radii: [0.0, 0.8, 0.3, 0.5, 0.7]  # Index = label ID
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      always_send_full_costmap: True

local_costmap_client:
  ros__parameters:
    use_sim_time: True

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.03
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: <robot_namespace>base_footprint
      # robot_radius: 0.22
      footprint: "[[-0.160, -0.120], [-0.160, 0.120], [0.160, 0.120], [0.160, -0.120]]"
      footprint_padding: 0.01
      resolution: 0.05
      #plugins: ["static_layer", "gnn_costmap_layer", "inflation_layer"]
      plugins: ["static_layer", "gnn_costmap_layer", "comms_risk_layer", "inflation_layer"]
      ## ----addded comms risk layer for global costmap
      comms_risk_layer:
        plugin: "nav2_comms_risk_layer::CommsRiskLayer"
        enabled: true
        topic: "/<robot_namespace>comms/link_stats"
        alpha: 0.2
        rsrp_min_dbm: -85.0
        rsrp_range_db: 25.0
        jitter_max_ms: 30.0
        jitter_range_ms: 40.0
        w_rsrp: 0.6
        w_jitter: 0.4
        w_loss: 0.0
        k_cost: 200.0            # only used when use_bands: false
        inflation_radius_m: 0.5     # smaller halo disk from 1.2 ->0.5
        decay_time_s: 10.0          # halo clears ~3x faster reduced from 30->10
        only_raise: true
        # --- three-band painting (NEW) -----------------------------------
        use_bands: true          # false → revert to smooth k_cost · risk halo
        green_rsrp_max_dbm: -84.0
        yellow_rsrp_max_dbm: -95.0
        green_cost: 30           # MUST be < 253 (else inflation_layer reacts)
        yellow_cost: 150         # MUST be < 253
        red_cost: 250            # MUST be < 253; 250 keeps clear separation from 253/254
      ## ---gnn costmap layer for global costmap, can be enabled if we want to consider dynamic objects in global planning, 
      ##but it may cause more noise in the global costmap and make the planner less efficient, 
      #so we can keep it disabled for now and only use it in the local costmap
      gnn_costmap_layer:
        plugin: "gnn_objects_layer::GNNObjectsLayer"
        enabled: False
        topic: "/tracked_polygons"
        label_decay_times: [5.0, 20.0, 5.0, 5.0, 20.0] #Other WS Robot Boundary Forklift
        
        # label_decay_times: [0.0, 15.0, 3.0, 30.0, 5.0] #Other WS Robot Boundary Forklift
        label_inflation_radii: [0.0, 0.8, 0.3, 0.5, 0.7]  # Index = label ID
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        cost_scaling_factor: 2.5
        inflate_unknown: false
        inflate_around_unknown: true  
      always_send_full_costmap: true

