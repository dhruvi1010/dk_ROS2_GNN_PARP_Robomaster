bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    odom_topic: "odom"
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # progress_checker_plugin: "progress_checker"
    # goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    # # Progress checker parameters
    # progress_checker:
    #   plugin: "nav2_controller::SimpleProgressChecker"
    #   required_movement_radius: 0.5
    #   movement_time_allowance: 10.0
    # # Goal checker parameters
    # goal_checker:
    #   plugin: "nav2_controller::SimpleGoalChecker"
    #   xy_goal_tolerance: 0.20
    #   yaw_goal_tolerance: 0.05
    #   stateful: True
 
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.0 #3.5
      max_vel_y: 0.2
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.25
      min_speed_theta: 0.0
      acc_lim_x: 1.75
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.75
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      
      # Goal Tolerance
      yaw_goal_tolerance: 0.60
      xy_goal_tolerance: 1.0
      trans_stopped_velocity: 0.25
      theta_stopped_velocity: 0.25

      # Forward Simulation
      sim_time: 0.8
      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 40
      sim_granularity: 0.025
      angular_sim_granularity: 0.025
      
      # Trajectory Scoring
      path_distance_bias: 24.0
      goal_distance_bias: 28.0
      occdist_scale: 0.02
      twirling_scale: 0.0
      stop_time_buffer: 0.2
      oscillation_reset_dist: 0.05
      oscillation_reset_angle: 0.2
      prune_plan: true
      prune_distance: 1.0

      # Debugging
      publish_cost_grid_pc: false
      publish_evaluation: true
      publish_global_plan: true
      publish_local_plan: true
      publish_trajectories: true
      publish_transformed_plan: true

      # Critic scoring parameters
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 20.0
      PathAlign.scale: 24.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_namespace>odom
      robot_base_frame: <robot_namespace>base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05      
      # robot_radius: 0.22
      footprint: "[[-0.160, -0.120], [-0.160, 0.120], [0.160, 0.120], [0.160, -0.120]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "gnn_costmap_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.2
      gnn_costmap_layer:
        plugin: "gnn_objects_layer::GNNObjectsLayer"
        enabled: True
        topic: "/tracked_polygons"
        label_decay_times: [5.0, 20.0, 5.0, 5.0, 20.0] #Other WS Robot Boundary Forklift
        
        # label_decay_times: [0.0, 15.0, 3.0, 30.0, 5.0] #Other WS Robot Boundary Forklift
        label_inflation_radii: [0.0, 0.8, 0.3, 0.4, 0.7]  # Index = label ID
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: scan
      #   scan:
      #     topic: /<robot_namespace>scan_filtered
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      always_send_full_costmap: True

local_costmap_client:
  ros__parameters:
    use_sim_time: True

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.03
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: <robot_namespace>base_footprint
      # robot_radius: 0.22
      footprint: "[[-0.160, -0.120], [-0.160, 0.120], [0.160, 0.120], [0.160, -0.120]]"
      footprint_padding: 0.01
      resolution: 0.05
      plugins: ["static_layer", "gnn_costmap_layer", "inflation_layer"]
      gnn_costmap_layer:
        plugin: "gnn_objects_layer::GNNObjectsLayer"
        enabled: False
        topic: "/tracked_polygons"
        label_decay_times: [5.0, 20.0, 5.0, 5.0, 20.0] #Other WS Robot Boundary Forklift
        
        # label_decay_times: [0.0, 15.0, 3.0, 30.0, 5.0] #Other WS Robot Boundary Forklift
        label_inflation_radii: [0.0, 0.8, 0.3, 0.4, 0.7]  # Index = label ID
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 1.5
        inflate_unknown: false
        inflate_around_unknown: true  
      always_send_full_costmap: True

global_costmap_client:
  ros__parameters:
    use_sim_time: True
  
global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "map.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    local_frame: <robot_namespace>odom
    robot_base_frame: <robot_namespace>base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200



