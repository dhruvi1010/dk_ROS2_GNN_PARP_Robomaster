/**:
  ros__parameters:
    # Lidar settings
    use_lidar: false
    # global_frame: "ep02/odom"
    # QoS settings
    input_qos: "SENSOR_DATA"
    # Map clearing settings
    # map_clearing_frame_id: "ep02/camera0_link"
    # Rviz visualization
    # esdf_slice_bounds_visualization_attachment_frame_id: "ep02/camera0_link"
    # decay tsdf rate 0.0 for mapping
    decay_tsdf_rate_hz: 0.0

    static_mapper:
      esdf_slice_height: 0.0
      # Expected to be tuned by users. Slice height depends on realsense mounting.
      esdf_slice_min_height: -0.2
      esdf_slice_max_height: 0.5

    dynamic_mapper:
      esdf_slice_height: 0.0
      esdf_slice_min_height: -0.2
      esdf_slice_max_height: 0.5
